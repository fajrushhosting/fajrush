    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 40px 20px;
        }

        .logo {
            font-size: 3rem;
            font-weight: 700;
            background: linear-gradient(90deg, #6366f1, #ec4899);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 10px;
        }

        .tagline {
            font-size: 1.2rem;
            color: #cbd5e1;
            margin-bottom: 30px;
        }

        /* Marquee Styling */
        .marquee-container {
            background: rgba(30, 41, 59, 0.8);
            border-radius: 12px;
            padding: 15px;
            margin: 20px auto;
            max-width: 800px;
            border: 1px solid #334155;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .marquee {
            font-size: 1.4rem;
            font-weight: 600;
            color: #60a5fa;
            white-space: nowrap;
            animation: marquee 20s linear infinite;
        }

        @keyframes marquee {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }

        /* Profile Section */
        .profile {
            text-align: center;
            margin: 40px auto;
            max-width: 600px;
        }

        .profile h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .profile p {
            color: #cbd5e1;
            font-size: 1.1rem;
            line-height: 1.6;
        }

        /* Links Section */
        .links-section {
            margin: 40px 0;
        }

        .section-title {
            font-size: 1.8rem;
            text-align: center;
            margin-bottom: 30px;
            color: #60a5fa;
            position: relative;
            display: inline-block;
            left: 50%;
            transform: translateX(-50%);
        }

        .section-title::after {
            content: '';
            position: absolute;
            width: 60%;
            height: 3px;
            background: linear-gradient(90deg, #6366f1, #ec4899);
            bottom: -10px;
            left: 20%;
        }

        .links-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .link-card {
            background: rgba(30, 41, 59, 0.9);
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            transition: all 0.3s ease;
            border: 1px solid #334155;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .link-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(99, 102, 241, 0.2);
            border-color: #6366f1;
        }

        .link-icon {
            font-size: 2.5rem;
            margin-bottom: 15px;
        }

        .instagram { color: #e4405f; }
        .sociabuzz { color: #3b82f6; }
        .channel { color: #f59e0b; }
        .tiktok { color: #000000; }
        .linktree { color: #10b981; }

        .link-title {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: #f8fafc;
        }

        .link-description {
            color: #cbd5e1;
            margin-bottom: 20px;
            font-size: 0.95rem;
        }

        .btn {
            display: inline-block;
            padding: 12px 30px;
            background: linear-gradient(90deg, #6366f1, #ec4899);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(99, 102, 241, 0.4);
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.6);
        }

        /* Follow Section */
        .follow-section {
            text-align: center;
            margin: 60px 0;
        }

        .follow-title {
            font-size: 1.8rem;
            margin-bottom: 30px;
            color: #60a5fa;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 30px 0;
            margin-top: 40px;
            border-top: 1px solid #334155;
            color: #94a3b8;
            font-size: 0.9rem;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .container {
                padding: 10px;

            .logo {

            }
            
            .marquee {

            }

            }
            
            .links-container {
                grid-template-columns: 1fr;
            }
            
            .link-card {
                padding: 20px;
        <!-- Marquee Teks Berjalan -->

                SELAMAT DATANG DI WEBSITE RESMI FAJRUSH, FOLLOW SEMUA SOSIAL MEDIA SAYA AGAR MENDAPATKAN UPDATE DARI SAYA
            </div>
        </div>

        <!-- Profile Section -->
        <section class="profile">

            <p>Kreator konten dengan passion di berbagai platform media sosial. Saya berbagi konten menarik, rekomendasi produk, dan informasi terbaru untuk Anda.</p>
        </section>

        <!-- Ikuti Kami Section -->ki

        <!-- Links Section -->
        <section class="links-section">
            <h2 class="section-title">Sosial Media & Link</h2>
            
            <div class="links-container">
                <!-- Instagram -->
                <div class="link-card">
                    <div class="link-icon instagram">

                    <h3 class="link-title">Instagram</h3>
                    <p class="link-description">Ikuti saya di Instagram untuk update harian dan konten eksklusif</p>
                    <a href="https://www.instagram.com/fajrush33" target="_blank" class="btn">Kunjungi Instagram</a>

                <!-- Channel Orang Gabut -->
                <div class="link-card">

                    <h3 class="link-title">Channel Orang Gabut</h3>
                    <p class="link-description">Konten santai dan menghibur di channel khusus untuk waktu luang</p>

                <!-- TikTok Official -->
                <div class="link-card">
                    <div class="link-icon tiktok">

        <!-- Footer -->
        <footer>

        </footer>
    </div>

    <script>
        // Tambahkan efek interaktif pada tombol
        document.querySelectorAll('.btn').forEach(button => {
            button.addEventListener('mouseenter', function() {
                this.style.background = 'linear-gradient(90deg, #ec4899, #6366f1)';
            });
            
            button.addEventListener('mouseleave', function() {
                this.style.background = 'linear-gradient(90deg, #6366f1, #ec4899)';
            });
        });
        
        // Animasi untuk kartu link saat halaman dimuat
        document.addEventListener('DOMContentLoaded', function() {
            const linkCards = document.querySelectorAll('.link-card');
            linkCards.forEach((card, index) => {
                card.style.opacity = '0';
                card.style.transform = 'translateY(20px)';
                
                setTimeout(() => {
                    card.style.transition = 'opacity 0.5s ease, transform 0.5s ease';
                    card.style.opacity = '1';
                    card.style.transform = 'translateY(0)';
                }, 100 * index);
            });
        });
    </script>
</body>
</html>
